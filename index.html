<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop stop-color='%2300b7ff'/%3E%3Cstop offset='1' stop-color='%236155f5'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='15' fill='url(%23g)'/%3E%3Cpath d='M25 21 14 32l11 11M39 21l11 11-11 11' fill='none' stroke='%23fff' stroke-width='5.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<script>
/* Apply saved appearance before first paint. */
(function () {
  var p = {};
  try { p = JSON.parse(localStorage.getItem('nt.prefs') || '{}') || {}; } catch (e) {}
  var d = document.documentElement;
  var theme = p.theme === 'light' || p.theme === 'dark' ? p.theme
    : (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  d.dataset.theme = theme;
  d.dataset.accent = p.accent || 'blue';
  if (typeof p.frost === 'number') d.style.setProperty('--frost', p.frost);
  if (p.solid) d.setAttribute('data-solid', '');
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
